name: Build Android
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: android-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install video encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Re-encode videos for broad Android compatibility
        run: |
          for video in app/src/main/res/raw/exercise_march_arm_sweep.mp4 app/src/main/res/raw/exercise_band_pull_apart.mp4; do
            ffmpeg -y -i "$video" -an -vf "scale=960:540:flags=lanczos" -pix_fmt yuv420p -c:v libx264 -profile:v baseline -level 3.1 -preset medium -crf 23 -movflags +faststart "${video%.mp4}.compatible.mp4"
            mv "${video%.mp4}.compatible.mp4" "$video"
          done
      - name: Build APK and release AAB
        run: gradle :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: azara-strong-android-builds
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
