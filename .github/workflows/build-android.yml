name: Build Android
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: android-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Restore row exercise video
        run: |
          cat video-assets/exercise_one_arm_row.part* | base64 --decode > app/src/main/res/raw/exercise_one_arm_row.mp4
      - name: Restore wall-slide exercise video
        run: |
          cat video-assets/exercise_wall_slide.part* | base64 --decode > app/src/main/res/raw/exercise_wall_slide.mp4
      - name: Restore remaining Day 1 videos
        run: |
          cat video-assets/exercise_pallof_press.part* | base64 --decode > app/src/main/res/raw/exercise_pallof_press.mp4
          cat video-assets/exercise_suitcase_march.part* | base64 --decode > app/src/main/res/raw/exercise_suitcase_march.mp4
          test "$(sha256sum app/src/main/res/raw/exercise_pallof_press.mp4 | cut -d ' ' -f 1)" = "d5c6c8c9d68522851f33f471c213948be5806deebd7078bf173d9f63db677c16"
          test "$(sha256sum app/src/main/res/raw/exercise_suitcase_march.mp4 | cut -d ' ' -f 1)" = "f3bfbe6dab8864140ddb366ba1e1cdb011c1b981b0c440a6e51e4d97b2df7bec"
      - name: Install video encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Re-encode videos for broad Android compatibility
        run: |
          for video in app/src/main/res/raw/exercise_march_arm_sweep.mp4 app/src/main/res/raw/exercise_band_pull_apart.mp4 app/src/main/res/raw/exercise_one_arm_row.mp4 app/src/main/res/raw/exercise_wall_slide.mp4; do
            ffmpeg -y -i "$video" -an -vf "scale=960:540:flags=lanczos" -pix_fmt yuv420p -c:v libx264 -profile:v baseline -level 3.1 -preset medium -crf 23 -movflags +faststart "${video%.mp4}.compatible.mp4"
            mv "${video%.mp4}.compatible.mp4" "$video"
          done
      - name: Restore Azara icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cat brand-assets/brand_woman.part* | base64 --decode > app/src/main/res/drawable-nodpi/brand_woman.png
      - name: Build APK and release AAB
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: azara-strong-android-builds
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/test-results/testDebugUnitTest/*.xml
